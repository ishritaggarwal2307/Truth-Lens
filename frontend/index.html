<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Truth-Lens | AI Audio Deepfake Detector</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            overflow-x: hidden;
        }
        
        .glow-effect {
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
        }
        
        .glow-green {
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.7);
            animation: pulse-green 2s infinite;
        }
        
        .glow-red {
            box-shadow: 0 0 40px rgba(239, 68, 68, 0.7);
            animation: pulse-red 2s infinite;
        }
        
        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 40px rgba(34, 197, 94, 0.7); }
            50% { box-shadow: 0 0 60px rgba(34, 197, 94, 0.9); }
        }
        
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 40px rgba(239, 68, 68, 0.7); }
            50% { box-shadow: 0 0 60px rgba(239, 68, 68, 0.9); }
        }
        
        .wave-animation {
            animation: wave 1.5s ease-in-out infinite;
        }
        
        @keyframes wave {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(1.5); }
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .card-glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .loading-spinner {
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-top-color: #3b82f6;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [isListening, setIsListening] = useState(false);
            const [status, setStatus] = useState('standby');
            const [result, setResult] = useState(null);
            const [analyzing, setAnalyzing] = useState(false);
            const [heatmap, setHeatmap] = useState(null);
            const [explanation, setExplanation] = useState('');
            
            const mediaRecorderRef = useRef(null);
            const intervalRef = useRef(null);

            const API_URL = 'http://localhost:8000';

            const startListening = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    mediaRecorderRef.current = new MediaRecorder(stream);
                    setIsListening(true);
                    setStatus('listening');
                    
                    mediaRecorderRef.current.ondataavailable = async (event) => {
                        if (event.data.size > 0) {
                            await analyzeAudio(event.data);
                        }
                    };
                    
                    mediaRecorderRef.current.start();
                    
                    // Record in 3-second chunks
                    intervalRef.current = setInterval(() => {
                        if (mediaRecorderRef.current && mediaRecorderRef.current.state === 'recording') {
                            mediaRecorderRef.current.stop();
                            mediaRecorderRef.current.start();
                        }
                    }, 3000);
                    
                } catch (error) {
                    console.error('Error accessing microphone:', error);
                    alert('Could not access microphone. Please check permissions.');
                }
            };

            const stopListening = () => {
                if (mediaRecorderRef.current) {
                    mediaRecorderRef.current.stop();
                    mediaRecorderRef.current.stream.getTracks().forEach(track => track.stop());
                }
                
                if (intervalRef.current) {
                    clearInterval(intervalRef.current);
                }
                
                setIsListening(false);
                setStatus('standby');
                setAnalyzing(false);
            };

            const analyzeAudio = async (audioBlob) => {
                setAnalyzing(true);
                
                const formData = new FormData();
                formData.append('file', audioBlob, 'audio.wav');
                
                try {
                    const response = await fetch(`${API_URL}/analyze`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (!response.ok) {
                        throw new Error('Analysis failed');
                    }
                    
                    const data = await response.json();
                    setResult(data);
                    setExplanation(data.explanation || '');
                    setHeatmap(data.heatmap || null);
                    setStatus(data.is_fake ? 'fake' : 'real');
                    
                } catch (error) {
                    console.error('Error analyzing audio:', error);
                    setStatus('error');
                } finally {
                    setAnalyzing(false);
                }
            };

            const getStatusColor = () => {
                switch (status) {
                    case 'real': return 'border-green-500 bg-green-500/20 glow-green';
                    case 'fake': return 'border-red-500 bg-red-500/20 glow-red';
                    case 'listening': return 'border-blue-500 bg-blue-500/20 glow-effect';
                    case 'error': return 'border-yellow-500 bg-yellow-500/20';
                    default: return 'border-gray-600 bg-gray-800/50';
                }
            };

            const getStatusText = () => {
                switch (status) {
                    case 'real': return 'AUTHENTIC VOICE';
                    case 'fake': return 'DEEPFAKE DETECTED';
                    case 'listening': return 'ANALYZING...';
                    case 'error': return 'ERROR';
                    default: return 'STANDBY';
                }
            };

            return (
                <div className="min-h-screen p-6 flex flex-col items-center">
                    {/* Header */}
                    <header className="text-center mb-12">
                        <h1 className="text-6xl font-bold mb-4">
                            <span className="gradient-text">TRUTH</span>
                            <span className="text-white">-LENS</span>
                        </h1>
                        <p className="text-gray-400 text-lg">
                            Real-Time Audio Deepfake Detection System
                        </p>
                        <div className="mt-4 flex gap-2 justify-center">
                            <span className="px-3 py-1 bg-blue-500/20 text-blue-400 rounded-full text-sm border border-blue-500/30">
                                AI-Powered
                            </span>
                            <span className="px-3 py-1 bg-purple-500/20 text-purple-400 rounded-full text-sm border border-purple-500/30">
                                CNN + Attention
                            </span>
                            <span className="px-3 py-1 bg-green-500/20 text-green-400 rounded-full text-sm border border-green-500/30">
                                Real-Time
                            </span>
                        </div>
                    </header>

                    {/* Main Detection Area */}
                    <div className="w-full max-w-4xl">
                        <div className={`card-glass rounded-3xl p-12 transition-all duration-500 ${getStatusColor()}`}>
                            <div className="flex flex-col items-center">
                                {/* Status Circle */}
                                <div className="relative w-64 h-64 mb-8">
                                    <div className="absolute inset-0 rounded-full border-4 flex items-center justify-center">
                                        {analyzing && (
                                            <div className="loading-spinner"></div>
                                        )}
                                        {!analyzing && (
                                            <div className="text-center">
                                                <p className="text-4xl font-bold text-white mb-2">
                                                    {getStatusText()}
                                                </p>
                                                {result && (
                                                    <p className="text-6xl font-bold text-white">
                                                        {result.confidence.toFixed(1)}%
                                                    </p>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                    
                                    {/* Waveform visualization */}
                                    {isListening && (
                                        <div className="absolute -bottom-12 left-0 right-0 flex justify-center gap-1">
                                            {[...Array(20)].map((_, i) => (
                                                <div
                                                    key={i}
                                                    className="w-1 bg-blue-500 wave-animation"
                                                    style={{
                                                        height: `${Math.random() * 40 + 10}px`,
                                                        animationDelay: `${i * 0.05}s`
                                                    }}
                                                />
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* Details */}
                                {result && (
                                    <div className="w-full mt-8 space-y-4">
                                        <div className="grid grid-cols-2 gap-4">
                                            <div className="card-glass rounded-xl p-4 text-center">
                                                <p className="text-gray-400 text-sm mb-1">Real</p>
                                                <p className="text-2xl font-bold text-green-400">
                                                    {result.confidence_real.toFixed(1)}%
                                                </p>
                                            </div>
                                            <div className="card-glass rounded-xl p-4 text-center">
                                                <p className="text-gray-400 text-sm mb-1">Fake</p>
                                                <p className="text-2xl font-bold text-red-400">
                                                    {result.confidence_fake.toFixed(1)}%
                                                </p>
                                            </div>
                                        </div>

                                        {explanation && (
                                            <div className="card-glass rounded-xl p-4">
                                                <p className="text-gray-300 text-sm leading-relaxed">
                                                    {explanation}
                                                </p>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Controls */}
                                <div className="mt-8 flex gap-4">
                                    {!isListening ? (
                                        <button
                                            onClick={startListening}
                                            className="px-8 py-4 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg"
                                        >
                                            🛡️ ACTIVATE SHIELD
                                        </button>
                                    ) : (
                                        <button
                                            onClick={stopListening}
                                            className="px-8 py-4 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl transition-all duration-300 transform hover:scale-105 shadow-lg"
                                        >
                                            ⏹️ STOP
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Heatmap Visualization */}
                        {heatmap && (
                            <div className="mt-8 card-glass rounded-xl p-6">
                                <h3 className="text-xl font-bold text-white mb-4">
                                    🔬 Explainability Heatmap
                                </h3>
                                <p className="text-gray-400 text-sm mb-4">
                                    Red regions indicate suspicious patterns detected by the AI model
                                </p>
                                <img
                                    src={`data:image/png;base64,${heatmap}`}
                                    alt="Grad-CAM Heatmap"
                                    className="w-full rounded-lg"
                                />
                            </div>
                        )}
                    </div>

                    {/* Info Section */}
                    <div className="mt-12 max-w-4xl w-full">
                        <div className="grid md:grid-cols-3 gap-4">
                            <div className="card-glass rounded-xl p-6 text-center">
                                <div className="text-3xl mb-2">🎯</div>
                                <h3 className="font-bold text-white mb-2">High Accuracy</h3>
                                <p className="text-gray-400 text-sm">
                                    Advanced CNN with attention mechanism
                                </p>
                            </div>
                            <div className="card-glass rounded-xl p-6 text-center">
                                <div className="text-3xl mb-2">⚡</div>
                                <h3 className="font-bold text-white mb-2">Real-Time</h3>
                                <p className="text-gray-400 text-sm">
                                    3-second analysis windows
                                </p>
                            </div>
                            <div className="card-glass rounded-xl p-6 text-center">
                                <div className="text-3xl mb-2">🔍</div>
                                <h3 className="font-bold text-white mb-2">Explainable AI</h3>
                                <p className="text-gray-400 text-sm">
                                    Grad-CAM heatmaps show decision process
                                </p>
                            </div>
                        </div>
                    </div>

                    {/* Footer */}
                    <footer className="mt-12 text-center text-gray-500 text-sm">
                        <p>Truth-Lens v1.0 | Built for Quantumard National Hackathon 2026</p>
                        <p className="mt-2">Powered by TensorFlow, FastAPI & React</p>
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
